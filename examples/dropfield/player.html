<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171a18">
  <title>Dropfield · Play</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../player.css">
  <script type="module" src="../player.js"></script>
</head>
<body>
  <main class="game" aria-label="Dropfield falling-block game">
    <section class="play-area">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600" tabindex="0" aria-label="Game board. Arrow keys move and rotate. Space drops. P pauses."></canvas>
        <div id="overlay" class="overlay">
          <p id="eyebrow">ONE BLOCK AT A TIME</p>
          <h1 id="overlay-title">Find your<br>flow.</h1>
          <p id="overlay-copy">Stack shapes.<br>Make room.</p>
          <button id="start" class="primary" type="button">Let’s play <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <aside class="sidebar" aria-label="Game controls and stats">
        <div class="top-actions">
          <button id="sound" type="button" aria-label="Enable sound" title="Enable sound" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute-slash" d="m3 3 18 18"/></svg>
          </button>
          <button id="pause" type="button" aria-label="Pause" title="Pause" disabled>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg>
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="m8 5 11 7-11 7Z"/></svg>
          </button>
        </div>
        <div class="stats">
          <div class="stat"><span>SCORE</span><strong id="score">00000</strong></div>
          <div class="stat"><span>LINES</span><strong id="lines">00</strong></div>
          <div class="stat"><span>LEVEL</span><strong id="level">01</strong></div>
        </div>
        <div class="next"><span>UP NEXT</span><canvas id="next" width="160" height="100" aria-label="Next shape"></canvas></div>
        <nav class="touch-controls" aria-label="Game controls">
          <button data-action="left" aria-label="Move left" title="Move left (←)" disabled>←</button>
          <button data-action="rotate" aria-label="Rotate clockwise" title="Rotate clockwise (↑)" disabled>↻</button>
          <button data-action="right" aria-label="Move right" title="Move right (→)" disabled>→</button>
          <button data-action="down" aria-label="Soft drop" title="Soft drop (↓)" disabled>↓</button>
          <button data-action="drop" class="drop" aria-label="Hard drop" title="Hard drop (Space)" disabled>DROP <span aria-hidden="true">↡</span></button>
        </nav>
        <footer class="game-footer"><span id="status" role="status">YOUR NEXT SMALL OBSESSION</span><a href="../" target="_blank" rel="noopener noreferrer">Open full page ↗</a></footer>
      </aside>
    </section>
  </main>
  <noscript>This game needs JavaScript. <a href="../" target="_blank" rel="noopener noreferrer">Open the full page</a>.</noscript>
</body>
</html>
